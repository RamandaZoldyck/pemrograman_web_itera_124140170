###
# Konfigurasi aplikasi (development)
# https://docs.pylonsproject.org/projects/pyramid/en/latest/narr/environment.html
###

[app:main]
use = egg:pyramid_mahasiswa

pyramid.reload_templates = true
pyramid.debug_authorization = false
pyramid.debug_notfound = false
pyramid.debug_routematch = false
pyramid.default_locale_name = en
pyramid.includes =
    pyramid_debugtoolbar

# Koneksi PostgreSQL (SQLAlchemy + psycopg2)
sqlalchemy.url = postgresql://pyramid_user:pyramid_pass@localhost:5432/pyramid_mahasiswa

retry.attempts = 3

# Debug toolbar hanya aktif dari localhost
debugtoolbar.hosts = 127.0.0.1 ::1

###
# Konfigurasi Alembic
# https://alembic.sqlalchemy.org/en/latest/tutorial.html
###

[alembic]
script_location = pyramid_mahasiswa:alembic
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s

###
# Konfigurasi WSGI server
###

[server:main]
use = egg:waitress#main
listen = localhost:6543

###
# Konfigurasi logging
# https://docs.pylonsproject.org/projects/pyramid/en/latest/narr/logging.html
###

[loggers]
keys = root, pyramid_mahasiswa, sqlalchemy, alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console

[logger_pyramid_mahasiswa]
level = DEBUG
handlers =
qualname = pyramid_mahasiswa

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s:%(lineno)s][%(threadName)s] %(message)s
